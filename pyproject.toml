[project]
name = "kubesentinel-ai"
version = "0.1.0"
description = "Local KubeSentinel AI development foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "redis==8.1.0",
  "prometheus-client==0.26.0",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "PyJWT[crypto]==2.15.1",
]

[dependency-groups]
dev = ["httpx2==2.16.0", "pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1"]

[project.optional-dependencies]
ml = ["numpy==2.5.4", "scikit-learn==1.9.1", "matplotlib==3.11.2"]
ops = ["kubernetes==37.0.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["scripts", "apps/api", "ml", "services/anomaly-detector"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api/kubesentinel_api", "scripts", "tests", "ml/kubesentinel_ml", "services/anomaly-detector/kubesentinel_detector"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "numpy.*", "matplotlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis.*"]
follow_untyped_imports = true
